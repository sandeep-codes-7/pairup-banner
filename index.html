<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PairUp — Coming Soon</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-tr from-slate-950 via-purple-950 to-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
  <!-- Subtle Background Glows -->
  <div class="absolute top-1/4 left-1/4 -translate-x-1/2 -translate-y-1/2 w-[300px] sm:w-[500px] h-[300px] sm:h-[500px] bg-purple-600/10 rounded-full blur-[80px] pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 translate-x-1/2 translate-y-1/2 w-[300px] sm:w-[500px] h-[300px] sm:h-[500px] bg-indigo-600/10 rounded-full blur-[80px] pointer-events-none"></div>

  <div class="max-w-md text-center space-y-8 relative z-10">
    <!-- Badge -->
    <div class="inline-block px-3 py-1 text-xs font-semibold tracking-wider uppercase bg-purple-500/10 text-purple-400 rounded-full border border-purple-500/20">
      Under Construction
    </div>
    
    <!-- Hero Heading -->
    <h1 class="text-5xl font-extrabold tracking-tight sm:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-purple-400">
      pairup<span class="text-purple-500">.cc</span>
    </h1>
    
    <!-- Subtitle -->
    <p class="text-slate-400 text-sm sm:text-base leading-relaxed">
      Something exciting is in the works. Stay tuned.
    </p>

    <!-- Optional Email Notify Form -->
    <form class="flex flex-col sm:flex-row gap-2 max-w-sm mx-auto">
      <input type="email" placeholder="Enter your email" required class="flex-1 bg-white/5 border border-purple-500/20 rounded-lg px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 transition-all" />
      <button type="submit" class="bg-purple-600 hover:bg-purple-500 text-white font-medium text-sm rounded-lg px-5 py-2.5 transition-colors whitespace-nowrap shadow-lg shadow-purple-600/20">
        Notify Me
      </button>
    </form>
  </div>
</body>
</html>
